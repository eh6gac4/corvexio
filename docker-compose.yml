services:
  corvexio:
    build: .
    container_name: corvexio
    # Deployed via a Portainer "Git repository" stack, so there's no .env.production
    # file on disk to env_file from — Portainer injects these as stack environment
    # variables instead (see README.md). For a local `docker compose up`, put the
    # same vars in a gitignored .env file (copy .env.local.example). If you add a new
    # OBSIDIAN_* var to .env.local.example, add it here too — this list isn't
    # auto-synced with the example file.
    environment:
      OBSIDIAN_API_URL: ${OBSIDIAN_API_URL}
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY}
      OBSIDIAN_TLS_INSECURE: ${OBSIDIAN_TLS_INSECURE:-false}
      # Both empty by default (Access auth disabled) for local `docker compose up`; the
      # N100 stack sets these to require a valid Cloudflare Access JWT — see
      # src/lib/access-jwt.ts and .env.local.example.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      # Observed on the N100's Docker engine: baking `ENV HOSTNAME="0.0.0.0"` into the
      # Dockerfile was silently overridden back to the container ID at container
      # creation, while setting it here (compose-level) stuck. Setting it here is what
      # actually made the Next.js standalone server (which binds to $HOSTNAME) listen
      # on all interfaces instead of just the container's own bridge IP — needed for
      # both the healthcheck below (127.0.0.1) and any access not proxied by Docker.
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3100:3000"
      # Host port 3000 is already taken by another container on the N100, hence 3100.
      # Bound to loopback only: external access goes through the N100's cloudflared
      # tunnel (host network, so it can still reach 127.0.0.1:3100) fronted by
      # Cloudflare Access, not a direct LAN port. See src/lib/access-jwt.ts.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
